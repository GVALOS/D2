<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Nuevo Empleado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Registro de Nuevo Empleado</h1>
        
        {% if mensaje %}
        <div class="alert-error" style="color: red; margin-bottom: 15px; font-weight: bold;">
            {{ mensaje }}
        </div>
        {% endif %}
        
        <form method="POST" action="/empleados/nuevo">
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
            </div>
            
            <div class="form-group">
                <label for="dui">Número de DUI:</label>
                <input type="text" id="dui" name="dui" placeholder="00000000-0" required>
            </div>
            
            <div class="form-group">
                <label for="perfil">Perfil Profesional:</label>
                <select id="perfil" name="perfil" required>
                    <option value="" disabled selected>Seleccione un perfil</option>
                    <option value="medico">Médico</option>
                    <option value="administrativo">Administrativo</option>
                    <option value="enfermeria">Enfermería</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="estado_dui">Estado del DUI:</label>
                <select id="estado_dui" name="estado_dui">
                    <option value="pendiente">Pendiente</option>
                    <option value="validado">Validado</option>
                    <option value="rechazado">Rechazado</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="observaciones">Observaciones:</label>
                <textarea id="observaciones" name="observaciones" placeholder="Comentarios adicionales..."></textarea>
            </div>
            
            <div class="form-actions" style="margin-top: 20px;">
                <button type="submit">Guardar Empleado</button>
                <a href="/empleados" style="margin-left: 10px;">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
